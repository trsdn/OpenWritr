name: Bug report
description: Report something that does not work as documented
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here and do not include credentials, API keys, or dictated text you consider private. Use the security policy instead.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the minimal steps needed to reproduce the problem, including the hotkey, the target app, and whether Enhanced Mode was on.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: OpenWritr version (About OpenWritr), macOS version, Mac model, microphone in use, and the Enhanced Mode provider and model if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add screenshots or logs with secrets and personal data removed.
