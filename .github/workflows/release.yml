name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v1.2.1
        required: true
        type: string

permissions:
  contents: write

# One release run per tag at a time: two overlapping runs could test one set of
# assets while the other replaces them before the publish job runs.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-release:
    name: Build signed and notarized macOS artifacts
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v1.2.1: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      # Gate: nothing is built, signed, or published for a tag that cannot
      # describe itself. Fails before the signing certificate is imported.
      - name: Verify bundle version and changelog entry
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          plist_short="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          plist_build="$(plutil -extract CFBundleVersion raw Info.plist)"
          if [[ "$plist_short" != "$RELEASE_VERSION" || "$plist_build" != "$RELEASE_VERSION" ]]; then
            echo "Info.plist is $plist_short (build $plist_build) but the tag is $RELEASE_VERSION." >&2
            echo "Bump CFBundleShortVersionString and CFBundleVersion before tagging." >&2
            exit 1
          fi

          # Entries still held under an unreleased heading would ship in no release notes.
          held="$(awk '
            tolower($0) ~ /^##[ \t]+\[?unreleased\]?/ { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | tr -d '[:space:]')"
          if [[ -n "$held" ]]; then
            echo "CHANGELOG.md still holds entries under Unreleased; promote them into $RELEASE_VERSION." >&2
            exit 1
          fi

          # The published notes are the maintained changelog entry, never text written here.
          awk -v version="$RELEASE_VERSION" '
            BEGIN { gsub(/\./, "\\.", version) }
            $0 ~ "^## \\[?" version "\\]?([ \t]|$)" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")" ]]; then
            echo "CHANGELOG.md has no entry for $RELEASE_VERSION." >&2
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_CERTIFICATE_PWD" ]]; then
            echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD secrets are required."
            exit 1
          fi

          signing_dir="$GITHUB_WORKSPACE/.build/ci-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cert_file="$signing_dir/developer-id.p12"
          ca_file="$signing_dir/DeveloperIDG2CA.cer"
          keychain_file="$signing_dir/build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          import_succeeded=false

          cleanup_import() {
            rm -f -- "$cert_file" "$ca_file"
            if [[ "$import_succeeded" != true ]]; then
              security delete-keychain "$keychain_file" 2>/dev/null || true
              rm -f -- "$keychain_file"
              rmdir -- "$signing_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_import EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          mkdir -p "$signing_dir"
          set +x
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$cert_file"
          curl --fail --silent --show-error --location \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" \
            --output "$ca_file"

          security create-keychain -p "$keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$keychain_password" "$keychain_file"
          security import "$ca_file" -k "$keychain_file" -T /usr/bin/codesign
          security import "$cert_file" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$keychain_file"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_file"
          security list-keychains -d user -s "$keychain_file" $(security list-keychains -d user | tr -d '"')

          identity="$(
            security find-identity -v -p codesigning "$keychain_file" |
              awk -F'"' '/Developer ID Application/ && !identity { identity = $2 } END { print identity }'
          )"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity not found."
            exit 1
          fi

          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "OPENWRITR_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_FILE=$keychain_file" >> "$GITHUB_ENV"
          echo "SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"
          import_succeeded=true

      - name: Build Developer ID signed app
        shell: bash
        env:
          OPENWRITR_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/build-app.sh

      - name: Notarize app and package ZIP
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APP_PATH: .build/release/OpenWritr.app
          ZIP_PATH: dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.zip
        run: |
          set -euo pipefail
          scripts/notarize_app.sh

      - name: Build signed DMG from stapled app
        shell: bash
        env:
          APP_PATH: .build/release/OpenWritr.app
          DMG_PATH: dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.dmg
          REQUIRE_NOTARIZED_APP: "true"
        run: |
          set -euo pipefail
          scripts/make_dmg.sh

      - name: Notarize DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DMG_PATH: dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.dmg
        run: |
          set -euo pipefail
          scripts/notarize_dmg.sh

      - name: Create AppUpdater-named DMG copy
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # AppUpdater (in-app updater) expects a release DMG named
          # exactly "<repo>-<semver>.dmg" (no "v" prefix, no arch suffix).
          # Reuse the already-signed and notarized bytes rather than
          # rebuilding, so no additional signing/notarization is required.
          cp "dist/OpenWritr-v${RELEASE_VERSION}-macOS-arm64.dmg" "dist/OpenWritr-${RELEASE_VERSION}.dmg"

      # Do NOT attest this DMG. OpenWritr 1.6.0 was built with an attestation
      # policy, and verifying an attestation crashes it (see #31). Without an
      # attestation for the digest, 1.6.0 rejects the update cleanly before it
      # reaches that code.

      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_FILE:-}" ]]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
            rm -f -- "$KEYCHAIN_FILE"
          fi
          if [[ -n "${SIGNING_DIR:-}" ]]; then
            rmdir -- "$SIGNING_DIR" 2>/dev/null || true
          fi

      - name: Verify release artifacts
        shell: bash
        env:
          APP_PATH: .build/release/OpenWritr.app
          ASSET_BASE: dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64
          APPUPDATER_DMG: dist/OpenWritr-${{ steps.release.outputs.version }}.dmg
        run: |
          set -euo pipefail
          artifacts=(
            "$ASSET_BASE.zip"
            "$ASSET_BASE.zip.sha256"
            "$ASSET_BASE.dmg"
            "$ASSET_BASE.dmg.sha256"
            "$APPUPDATER_DMG"
          )
          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected release artifact is missing: $artifact"
              exit 1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$ASSET_BASE.dmg"
          xcrun stapler validate "$ASSET_BASE.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$ASSET_BASE.dmg"
          hdiutil verify "$ASSET_BASE.dmg"
          hdiutil verify "$APPUPDATER_DMG"
          (
            cd "$(dirname "$ASSET_BASE")"
            asset_name="$(basename "$ASSET_BASE")"
            shasum -a 256 -c "$asset_name.zip.sha256"
            shasum -a 256 -c "$asset_name.dmg.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64
          if-no-files-found: error
          path: |
            dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.zip
            dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.zip.sha256
            dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.dmg
            dist/OpenWritr-v${{ steps.release.outputs.version }}-macOS-arm64.dmg.sha256
            dist/OpenWritr-${{ steps.release.outputs.version }}.dmg

      - name: Attach assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset_base="dist/OpenWritr-v${RELEASE_VERSION}-macOS-arm64"
          assets=(
            "$asset_base.zip"
            "$asset_base.zip.sha256"
            "$asset_base.dmg"
            "$asset_base.dmg.sha256"
            "dist/OpenWritr-${RELEASE_VERSION}.dmg"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Expected release asset is missing: $asset"
              exit 1
            fi
          done

          # Notes come from the changelog entry checked by the gate above. A new
          # release is created as a DRAFT: nobody, including the in-app updater,
          # can receive it until the smoke test has passed and the publish job
          # below makes it public. An existing release keeps its state.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "OpenWritr ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES_FILE"
          elif [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --title "OpenWritr ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES_FILE"
          else
            # Replacing the assets of a public release would expose untested
            # files, and a failing smoke test could not take them back.
            echo "Release $RELEASE_TAG is already public; refusing to replace its assets. Publish a new version instead." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  # R05: install the uploaded DMG and exercise it, as a consumer would, BEFORE
  # the release becomes public. A failure leaves the draft unpublished.
  smoke-test:
    name: Smoke-test the release before publishing
    needs: macos-release
    permissions:
      # Draft releases are only visible to a token with write access. The
      # called job downloads and runs the assets; it changes nothing.
      contents: write
    uses: ./.github/workflows/smoke-test.yml
    with:
      tag: ${{ needs.macos-release.outputs.tag }}

  publish:
    name: Publish the release
    needs: [macos-release, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the tested draft public
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.macos-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Release $RELEASE_TAG is still a draft." >&2
            exit 1
          fi

      - name: Verify the public download is the file that was tested
        env:
          RELEASE_TAG: ${{ needs.macos-release.outputs.tag }}
          TESTED_SHA256: ${{ needs.smoke-test.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$TESTED_SHA256" ]]; then
            echo "The smoke test did not report the digest it tested." >&2
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          name="OpenWritr-${RELEASE_TAG}-macOS-arm64.dmg"
          mkdir public && cd public
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 -O "$base/$name" -O "$base/$name.sha256"
          shasum -a 256 -c "$name.sha256"
          public_sha="$(shasum -a 256 "$name" | cut -d' ' -f1)"
          if [[ "$public_sha" != "$TESTED_SHA256" ]]; then
            echo "The public DMG ($public_sha) is not the file the smoke test ran ($TESTED_SHA256)." >&2
            exit 1
          fi
