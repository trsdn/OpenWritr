name: CodeQL

# Advanced setup, not GitHub's automatic "default setup". Default setup left
# this repository's CodeQL configuration showing no selected language and no
# completed run: SwiftPM packages need an explicit build step, which default
# setup does not infer for Swift. This workflow builds the package with
# `swift build` in manual build mode so CodeQL actually analyzes the source.
#
# Requires the repository's code scanning setting to be switched from
# "Default" to "Advanced" (Settings -> Code security -> Code scanning) before
# this workflow can upload results; the two setups cannot run at once. That
# switch, like other repository settings, is a maintainer action.
#
# Do not add "CodeQL" as a required status check until several scheduled and
# pull-request runs have completed successfully; see AGENTS.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, off-hours, offset from the hour to avoid the GitHub Actions
    # top-of-hour scheduling spike; the specific day and minute don't matter.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # A plain debug build is enough for CodeQL to trace and index the source;
      # it does not need the release optimizations or the warnings-as-errors
      # gate that AGENTS.md's validation build uses, and it builds faster here.
      - name: Build
        run: swift build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:swift'
