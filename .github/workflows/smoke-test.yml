name: Release smoke test
run-name: Smoke-test OpenWritr ${{ inputs.tag }} (${{ inputs.nonce }})

# Installs the release's disk image the way a consumer would and exercises its
# core function (speech-to-text) through the app's non-interactive --self-test
# entry point. The job summary is the dated record for criterion R05.
#
# The maintainer's secretless broker handoff runs this against a DRAFT release
# before making it public. It can also be run again for a published tag.
# Releases before the one that introduced --self-test fail the check below.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft or published release tag to test, for example v1.6.5
        required: true
        type: string
      expected_dmg_sha256:
        description: SHA-256 of the exact versioned DMG in the draft
        required: true
        type: string
      expected_checksum_sha256:
        description: SHA-256 of the exact DMG checksum file in the draft
        required: true
        type: string
      nonce:
        description: Unique request correlation nonce
        required: true
        type: string

permissions: {}

jobs:
  smoke:
    name: Install and transcribe
    runs-on: macos-15
    timeout-minutes: 30
    # GitHub exposes draft releases only to identities with push-level access.
    # This checkout-free job needs contents: write solely to download the
    # maintainer-created draft. It never creates, edits, uploads, or publishes
    # a release, and dispatch is bound to trusted main plus immutable digests.
    permissions:
      contents: write
    steps:
      - name: Authorize trusted dispatch and immutable inputs
        shell: bash
        env:
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CHECKSUM_SHA256: ${{ inputs.expected_checksum_sha256 }}
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          NONCE: ${{ inputs.nonce }}
          REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ||
                "$REF" != "refs/heads/main" ||
                "$ACTOR_ID" != "24534196" ||
                "$REPOSITORY_ID" != "1165782217" ]]; then
            echo "Release smoke tests require an authorized dispatch from trusted main." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3: $TAG" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_DMG_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$EXPECTED_CHECKSUM_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Expected release digests must be lowercase SHA-256 values." >&2
            exit 1
          fi
          if [[ ! "$NONCE" =~ ^smoke-[0-9a-f]{32}$ ]]; then
            echo "Smoke request nonce is invalid." >&2
            exit 1
          fi

      - name: Download draft or published release DMG and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "OpenWritr-v${version}-macOS-arm64.dmg" \
            --pattern "OpenWritr-v${version}-macOS-arm64.dmg.sha256"

      - name: Verify downloaded DMG
        id: verify-download
        shell: bash
        env:
          EXPECTED_CHECKSUM_SHA256: ${{ inputs.expected_checksum_sha256 }}
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg="dl/OpenWritr-${TAG}-macOS-arm64.dmg"
          checksum="$dmg.sha256"
          if [[ ! -f "$dmg" || ! -f "$checksum" ]]; then
            echo "Expected smoke-test DMG or checksum is missing for $TAG." >&2
            exit 1
          fi
          dmg_sha256="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          checksum_sha256="$(shasum -a 256 "$checksum" | cut -d' ' -f1)"
          if [[ "$dmg_sha256" != "$EXPECTED_DMG_SHA256" ||
                "$checksum_sha256" != "$EXPECTED_CHECKSUM_SHA256" ]]; then
            echo "Draft release bytes do not match the authenticated broker candidate." >&2
            exit 1
          fi
          (cd dl && shasum -a 256 -c "$(basename "$checksum")")
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      - name: Install to /Applications
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/openwritr-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$mountpoint"
          rm -rf /Applications/OpenWritr.app
          ditto "$mountpoint/OpenWritr.app" /Applications/OpenWritr.app
          hdiutil detach "$mountpoint"

      - name: Verify signature and notarization as Gatekeeper sees them
        shell: bash
        run: |
          set -euo pipefail
          app=/Applications/OpenWritr.app
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          team_id="$(printf '%s\n' "$signature" | awk -F= '/^TeamIdentifier=/ { print $2; exit }')"
          identifier="$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          if [[ "$team_id" != "G69Z5BNY97" || "$identifier" != "com.openwritr.app" ]]; then
            echo "Unexpected release identity: Team $team_id, bundle $identifier." >&2
            exit 1
          fi
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Transcribe a spoken phrase with the installed app
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          app=/Applications/OpenWritr.app
          binary="$app/Contents/MacOS/OpenWritr"
          version="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "Installed app is $version but the tag is $TAG." >&2
            exit 1
          fi
          if ! grep -aq -- '--self-test' "$binary"; then
            echo "$TAG predates the --self-test entry point; nothing to exercise." >&2
            exit 1
          fi

          phrase="Hello world, this is an OpenWritr smoke test."
          say -o "$RUNNER_TEMP/smoke.aiff" "$phrase"
          "$binary" --self-test "$RUNNER_TEMP/smoke.aiff" hello world smoke test | tee "$RUNNER_TEMP/self-test.log"

          {
            echo "## Release smoke test: OpenWritr $version"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Date | $(date -u +%F) |"
            echo "| Version | $version ($TAG) |"
            echo "| Asset | $(basename "$DMG_PATH"), checksum verified before installation |"
            echo "| macOS | $(sw_vers -productVersion) on $(uname -m) |"
            echo "| Exercised | Installed to /Applications, Gatekeeper and notarization checks, transcribed a synthesized phrase with the shipped speech model and required the words: hello world smoke test |"
            echo "| Result | passed |"
            echo
            echo '```'
            cat "$RUNNER_TEMP/self-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
