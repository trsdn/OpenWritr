name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Swift 6 strict concurrency is the static check for this package; treating
      # warnings as errors keeps it from eroding. Release mode is what ships.
      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
